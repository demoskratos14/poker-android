name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer Java 17 (requis par le plugin Gradle Android)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Installer les dependances systeme necessaires a Buildozer
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 \
            cmake libffi-dev libssl-dev build-essential ccache

      - name: Installer Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython

      - name: Compiler l'APK (peut prendre 20 a 40 min la premiere fois)
        run: |
          yes | buildozer android debug

      - name: Mettre l'APK a disposition en telechargement
        uses: actions/upload-artifact@v4
        with:
          name: poker-apk
          path: bin/*.apk
